<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Thought Pattern — Design & Strategy Studio</title>
<meta name="description" content="We design the experiences and solutions to real world problems for organisations and businesses.">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1B1B2F;
    --ink-soft:#4A4A5A;
    --paper:#FAFAF8;
    --accent:#E0A039;
    --rule: rgba(27,27,47,0.14);
  }

  ::selection{ background: var(--accent); color:#fff; }

  html, body{
    height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display:flex;
    flex-direction:column;
  }

  a{ color: inherit; }

  .heading-font{
    font-family: 'Merriweather', serif;
  }

  /* Edge label — vertical editorial strip, left margin */
  .edge-label{
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 48px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 32px;
    z-index: 5;
  }
  .edge-label span{
    display:block;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* Top bar */
  .topbar{
    padding: 32px 32px 32px 88px;
  }
  .topbar .tagline{
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* Hero */
  .hero-wrap{
    flex: 1 1 auto;
    display:flex;
    align-items:center;
    padding: 0 32px 0 88px;
  }

  .hero-row{
    display:flex;
    align-items:flex-start;
    gap: 56px;
    max-width: 1180px;
    width:100%;
  }

  .logo-mark{
    flex: 0 0 auto;
    width: 168px;
    padding-top: 14px;
  }
  .logo-mark img{
    width: 100%;
    height: auto;
    display:block;
  }

  .hero-copy{
    flex: 1 1 auto;
    border-left: 1px solid var(--rule);
    padding-left: 56px;
  }

  .hero-copy h1{
    font-family: 'Merriweather', serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 4.4vw, 3.6rem);
    line-height: 1.22;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0 0 28px 0;
    max-width: 18ch;
  }

  .hero-copy .status{
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .hero-copy .status::before{
    content: "";
    display:inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 auto;
  }

  /* Footer */
  .footer-bar{
    padding: 28px 32px 40px 88px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top: 1px solid var(--rule);
    margin-left: 88px;
    margin-right: 32px;
    padding-left: 0;
  }
  .footer-bar .meta,
  .footer-bar .contact{
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .footer-bar .contact a{
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    transition: border-color .2s ease, color .2s ease;
  }
  .footer-bar .contact a:hover{
    color: var(--ink);
    border-color: var(--ink);
  }

  @media (max-width: 767.98px){
    .edge-label{ display:none; }
    .topbar{ padding: 24px 24px 0 24px; }
    .hero-wrap{ padding: 40px 24px; }
    .hero-row{
      flex-direction: column;
      gap: 28px;
    }
    .logo-mark{ width: 120px; padding-top: 0; }
    .hero-copy{
      border-left: none;
      padding-left: 0;
      border-top: 1px solid var(--rule);
      padding-top: 24px;
    }
    .hero-copy h1{ max-width: none; }
    .footer-bar{
      margin-left: 24px;
      margin-right: 24px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
  }
</style>
</head>
